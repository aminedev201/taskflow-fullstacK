# Optional: run MySQL + backend together.  docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskflow
    ports: ["3308:3308"]
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://db:3308/taskflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-to-a-long-random-secret-at-least-32-chars
      CORS_ORIGINS: http://localhost:3000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports: ["8080:8080"]
volumes:
  db_data:
