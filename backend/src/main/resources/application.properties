spring.application.name=taskflow
server.port=${APP_PORT}

spring.datasource.url=${TASKFLOW_DB_URL}
spring.datasource.username=${TASKFLOW_DB_USERNAME}
spring.datasource.password=${TASKFLOW_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
app.cors.allowed-origins=${CORS_ORIGINS}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.seed-demo=${SEED_DEMO}
